version: '3.8'

services:
  # 主程序服务
  main-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.main
    container_name: xiaozhi-main-server
    ports:
      - "18989:8989"
      - "12883:2883"
    volumes:
      - ../config:/workspace/config
      - ../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

networks:
  xiaozhi-network:
    driver: bridge
