version: '3.8'

services:
  # Main device server.
  main-server:
    image: ghcr.io/hackers365/xiaozhi_server:0.6.0
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml"]
    ports:
      - "8989:8989"        # WebSocket
      - "2883:2883"        # MQTT
      - "8888:8888/udp"    # UDP
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Vector database for speaker embeddings. Off unless the voiceprint profile is selected.
  qdrant:
    profiles: ["voiceprint"]
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"         # REST API
      - "6334:6334"         # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Voice server (not vendored). Start it with: docker compose --profile voiceprint up
  voice-server:
    profiles: ["voiceprint"]
    image: ghcr.io/hackers365/voice_server:0.1.2
    container_name: xiaozhi-voice-server
    ports:
      - "8082:8080"
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      # The voice server's own default threshold is 0.6. The Go client falls back to 0.4
      # only when voice_identify.threshold is unset; the seeded settings value is 0.6.
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
