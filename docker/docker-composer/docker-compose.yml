version: '3.8'

services:
  # 主程序服务
  main-server:
    image: ghcr.io/hackers365/xiaozhi_server:0.6.0
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml"]
    ports:
      - "8989:8989"        # websocket服务 端口 18989端口
      - "2883:2883"        # mqtt server 12883
      - "8888:8888/udp"     # udp server 8888
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Qdrant向量数据库服务（用于说话人识别）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"         # REST API 端口
      - "6334:6334"         # gRPC 端口
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # ASR语音识别服务（说话人识别）
  voice-server:
    image: ghcr.io/hackers365/voice_server:0.1.2    # 替换为实际的镜像名称
    container_name: xiaozhi-voice-server
    ports:
      - "8082:8080"         # ASR服务端口 映射至宿主机 8082
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
