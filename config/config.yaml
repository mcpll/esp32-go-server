# Server config.
# What must exist before PocketBase answers, plus secrets, lives here. Everything else system-wide
# (mqtt, udp, ota, mcp, vad, chat, ...) is read from the PocketBase `settings` collection at start
# and overrides the values below.

# Server
server:
  # pprof profiling
  pprof:
    enable: false  # enable pprof
    port: 6060     # pprof listen port

# Device authentication: the OTA response carries an activation code until the owner binds the device
auth:
  enable: true

# Chat
chat:
  max_idle_duration: 30000         # max idle time of a session (ms), 0 means unlimited
  chat_max_silence_duration: 400   # silence that ends a sentence (ms), default 400
  speak_request_reuse_window_ms: 60000 # reuse window of the MQTT-UDP speak path (ms)
  realtime_mode: 4 # 1: interrupt on VAD, 2: interrupt on ASR, 3: interrupt on ASR when a voiceprint is recognized, 4: interrupt when ASR returns a result (streaming or offline)

chat_hooks:
  enabled: true
  async:
    queue_size: 1024
    worker_count: 1
    drop_when_full: false
    timeout_ms: 200
  plugins:
    statistic_plugin:
      enabled: true
      priority: 100

# Config provider (domain/config/pocketbase). PocketBase holds agents, devices and settings.
config_provider:
  type: "pocketbase"

# PocketBase connection. The server logs in with one superuser account.
# Env overrides the values here: POCKETBASE_URL, POCKETBASE_EMAIL, POCKETBASE_PASSWORD.
pocketbase:
  url: "http://127.0.0.1:8090"
  email: ""
  password: ""

# Signing token of the MCP/OpenClaw endpoint JWTs. Required. Env: ENDPOINT_AUTH_TOKEN
manager:
  endpoint_auth_token: ""

# Fallback system prompt, used only when a session has no agent prompt
system_prompt: "Sei un assistente vocale gentile. Rispondi in italiano con frasi brevi, senza emoji, codice o tag xml."

# Log
log:
  path: "../logs/"      # log directory
  file: "server.log"    # log file name
  level: "debug"        # log level (debug/info/warn/error)
  max_age: 3           # days to keep log files
  rotation_time: 10    # log rotation interval (hours)
  stdout: true         # also write to the console

# Redis, optional. Short memory (memory_mode: short) needs it; leave it disabled otherwise.
redis:
  enable: false          # use Redis for short memory
  host: "127.0.0.1"      # Redis host
  port: 6379             # Redis port
  password: "ticket_dev" # Redis password
  db: 0                  # database number
  key_prefix: "xiaozhi"  # key prefix

# WebSocket server. token is required (env WEBSOCKET_TOKEN) and is sent to the device in the OTA response.
websocket:
  host: "0.0.0.0"  # listen address, 0.0.0.0 listens on all interfaces
  port: 8989       # WebSocket listen port
  token: ""

# MQTT client (connects to an external MQTT broker)
mqtt:
  enable: true                # enable the MQTT client; when false the UDP server is closed as well
  broker: "127.0.0.1"         # MQTT broker address
  type: "tcp"                 # connection type
  port: 2883                  # MQTT port
  client_id: "xiaozhi_server" # client id
  username: "admin"           # MQTT user name
  password: ""                # MQTT password

# MQTT server (runs the embedded broker)
mqtt_server:
  enable: true                          # enable the MQTT server
  listen_host: "0.0.0.0"                # listen address
  listen_port: 2883                     # listen port
  client_id: "xiaozhi_server"           # server client id
  username: "admin"                     # default user name
  password: ""                          # super-admin password; required (env MQTT_SERVER_PASSWORD)
  signature_key: ""                     # required when enable_auth is true (env MQTT_SERVER_SIGNATURE_KEY)
  enable_auth: false                    # enable authentication
  # TLS
  tls:
    enable: false                # enable TLS
    port: 8883                   # TLS port
    pem: "config/server.pem"     # certificate file
    key: "config/server.key"     # private key file

# UDP server
udp:
  external_host: "127.0.0.1"  # address sent to the device in the hello message
  external_port: 8990         # port sent to the device in the hello message
  listen_host: "0.0.0.0"      # listen address
  listen_port: 8990           # listen port

# Resource pools (shared defaults for every resource type)
resource_pools:
  max_size: 1000              # max resources
  min_size: 1                 # min resources (pre-created)
  max_idle: 50                # max idle resources
  acquire_timeout: 5s         # timeout to acquire a resource
  idle_timeout: 10m           # idle timeout of a resource
  validate_on_borrow: true    # validate a resource when it is acquired
  validate_on_return: true    # validate a resource when it is returned

# Voice activity detection (VAD)
vad:
  provider: "silero_vad"  # VAD provider: webrtc_vad, silero_vad or ten_vad (ten_vad has no linux/arm64 build)
  # WebRTC VAD
  webrtc_vad:
    pool_min_size: 5        # min pool size
    pool_max_size: 1000     # max pool size
    pool_max_idle: 100      # max idle pooled connections
    vad_sample_rate: 16000  # VAD sample rate
    vad_mode: 2             # VAD mode (0-3, higher is more sensitive)
  # Silero VAD
  silero_vad:
    model_path: "config/models/vad/silero_vad.onnx"  # model file
    threshold: 0.5                    # detection threshold
    min_silence_duration_ms: 100      # min silence (ms)
    sample_rate: 16000                # sample rate
    channels: 1                       # channels
    # pool_size: 10                    # optional; defaults to the CPU core count
    acquire_timeout_ms: 3000          # acquire timeout (ms)
  # TEN-VAD
  ten_vad:
    hop_size: 512                     # hop size
    threshold: 0.4                    # detection threshold
    pool_size: 10                     # pool size
    acquire_timeout_ms: 3000          # acquire timeout (ms)

# Automatic speech recognition (ASR). The agent record picks the provider and overrides these keys.
asr:
  provider: "aliyun_qwen3"  # ASR provider: funasr / aliyun_funasr / doubao / aliyun_qwen3 / xunfei
  # Aliyun Qwen3 ASR. The api_key falls back to the DASHSCOPE_API_KEY env var.
  aliyun_qwen3:
    api_key: ""
  # FunASR
  funasr:
    host: "127.0.0.1"          # FunASR host
    port: "10096"              # FunASR port
    mode: "offline"            # recognition mode: offline/online
    sample_rate: 16000         # sample rate
    chunk_size: [5, 10, 5]     # chunk size config
    chunk_interval: 10         # chunk interval (ms)
    max_connections: 5         # max connections
    timeout: 30                # timeout (s)
    auto_end: true             # end automatically
  # Aliyun FunASR config
  aliyun_funasr:
    api_key: ""
    ws_url: "wss://dashscope.aliyuncs.com/api-ws/v1/inference/"
    model: "fun-asr-realtime"
    format: "pcm"        # only pcm
    sample_rate: 16000     # only 16000
    language_hints: ["zh"]
    vocabulary_id: ""
    disfluency_removal_enabled: false
    timeout: 30

  # Doubao ASR config
  doubao:
    appid: "xxx"                    # app id
    access_token: "xxx-Cu"          # access token
    ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream"  # WebSocket URL
    model_name: "bigmodel"          # model name
    end_window_size: 800            # end window size
    enable_punc: true               # enable punctuation
    enable_itn: true                # enable inverse text normalization
    enable_ddc: false               # enable disfluency detection correction
    timeout: 30                     # timeout (s)

  # Xunfei ASR config
  xunfei:
    appid: ""                      # Xunfei AppID
    api_key: ""                    # Xunfei APIKey
    api_secret: ""                 # Xunfei APISecret
    host: "iat-api.xfyun.cn"       # WebSocket host
    path: "/v2/iat"                # WebSocket path
    domain: "iat"                  # business domain
    language: "zh_cn"              # language
    accent: "mandarin"             # accent
    sample_rate: 16000             # sample rate
    timeout: 30                    # timeout (s)

# Text to speech (TTS). The agent record picks the provider, voice and language.
tts:
  provider: "aliyun_qwen"  # TTS provider: aliyun_qwen/xiaozhi/doubao/doubao_ws/cosyvoice/edge/edge_offline/xunfei/xunfei_super_tts
  # Aliyun Qwen TTS (DashScope)
  aliyun_qwen:
    api_key: ""
  openai:  # OpenAI-compatible TTS service, SiliconFlow here
    api_key: "xxxx" # api key
    api_url: "https://api.siliconflow.cn/v1/audio/speech"
    model: "FunAudioLLM/CosyVoice2-0.5B"
    voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
    response_format: "mp3"
    speed: 1.0
    stream: true
  # Doubao TTS (HTTP)
  doubao: # practically dead, no streaming
    appid: "6886011847"                  # app id
    access_token: "access_token"         # access token
    model: "seed-tts-1.1"                # model
    voice: "BV001_streaming"             # voice
    api_url: "https://openspeech.bytedance.com/api/v3/tts/unidirectional"  # API URL
  # Doubao TTS (WebSocket), supports streaming output
  doubao_ws:
    appid: "6886011847"                         # app id
    access_token: "access_token"                # access token
    model: "seed-tts-1.1"                       # model
    resource_id: ""                             # optional; the instance id from the console is recommended, like TTS-SeedTTS2.xxxxx
    voice: ""                                   # voice
    ws_url: "wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream"  # WebSocket URL
  # CosyVoice TTS
  cosyvoice:
    api_url: "https://tts.linkerai.top/tts"  # API URL
    spk_id: "spk_id"                         # speaker id
    frame_duration: 60                       # frame duration (ms)
    target_sr: 24000                         # target sample rate
    audio_format: "mp3"                      # audio format
    instruct_text: "Ciao"                    # instruction text
  # Microsoft Edge TTS
  edge:
    voice: "it-IT-ElsaNeural"      # voice
    rate: "+0%"                    # rate adjustment
    volume: "+0%"                  # volume adjustment
    pitch: "+0Hz"                  # pitch adjustment
    connect_timeout: 10            # connect timeout (s)
    receive_timeout: 60            # receive timeout (s)
  # Edge offline TTS
  edge_offline:
    server_url: "ws://localhost:8080/tts"  # server URL
    timeout: 30                            # timeout (s)
    sample_rate: 16000                     # sample rate
    channels: 1                            # channels
    frame_duration: 20                     # frame duration (ms)
  # Xiaozhi TTS
  xiaozhi:
    server_addr: "wss://api.tenclass.net/xiaozhi/v1/"  # server address
    device_id: "ba:8f:17:de:94:94"                      # device id
    client_id: "e4b0c442-98fc-4e1b-8c3d-6a5b6a5b6a6d"  # client id
    token: "test-token"                                 # access token
  # Xunfei online TTS
  xunfei:
    app_id: ""
    api_key: ""
    api_secret: ""
    ws_url: "wss://tts-api.xfyun.cn/v2/tts"
    voice: "xiaoyan"
    audio_encoding: "raw"   # raw / opus
    sample_rate: 16000      # 8000 / 16000
    speed: 50               # 0-100
    volume: 50              # 0-100
    pitch: 50               # 0-100
    tte: "UTF8"
    reg: 0
    rdn: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30
  # Xunfei super-human TTS
  xunfei_super_tts:
    app_id: ""
    api_key: ""
    api_secret: ""
    ws_url: "wss://cbm01.cn-huabei-1.xf-yun.com/v1/private/mcd9m97e6"
    voice: "x6_lingxiaoxue_pro"
    audio_encoding: "raw"   # raw / opus
    sample_rate: 24000      # 8000 / 16000 / 24000
    speed: 50
    volume: 50
    pitch: 50
    bgs: 0
    reg: 0
    rdn: 0
    rhy: 0
    oral_level: "mid"
    spark_assist: 1
    stop_split: 0
    remain: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30

# Large language model (LLM). The agent record picks the provider and overrides these keys.
llm:
  provider: "aliyun"  # default LLM provider
  # Aliyun DashScope (OpenAI-compatible). The agent record sets model_name, base_url and max_tokens.
  aliyun:
    type: "openai"                               # interface type
    api_key: ""                                  # API key
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API base URL
  # DeepSeek V3 (SiliconFlow)
  deepseek:
    type: "openai"                               # interface type
    model_name: "Pro/deepseek-ai/DeepSeek-V3"    # model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # max generated tokens
  # DeepSeek V2.5 (SiliconFlow)
  deepseek2_5:
    type: "openai"                               # interface type
    model_name: "deepseek-ai/DeepSeek-V2.5"      # model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # max generated tokens
  # Qwen 72B (SiliconFlow)
  qwen_72b:
    type: "openai"                               # interface type
    model_name: "Qwen/Qwen2.5-72B-Instruct"      # model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # max generated tokens
  # ChatGLM (Zhipu AI)
  chatglmllm:
    type: "openai"                               # interface type
    model_name: "glm-4-flash"                    # model name
    base_url: "https://open.bigmodel.cn/api/paas/v4/"  # API base URL
    api_key: "api_key"                           # API key
    max_tokens: 500                              # max generated tokens
  # Aliyun Qwen
  aliyun_qwen:
    type: "openai"                               # interface type
    model_name: "qwen2.5-72b-instruct"           # model name
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API base URL
    api_key: "api_key"                           # API key
    max_token: 500                               # max generated tokens
  # Doubao DeepSeek
  doubao_deepseek:
    type: "openai"                               # interface type
    model_name: "deepseek-v3"                    # model name
    api_key: "api_key"                           # API key
    base_url: "https://ark.cn-beijing.volces.com/api/v3"  # API base URL
    max_tokens: 500                              # max generated tokens

# Vision
vision:
  enable_auth: false  # enable authentication
  vision_url: "http://192.168.208.214:8989/xiaozhi/api/vision"  # vision API URL sent to the device
  token: ""  # required; env VISION_TOKEN
  # Vision language model
  vllm:
    provider: "aliyun_vision"  # vision model provider
    # Aliyun vision model
    aliyun_vision:
      type: "openai"                               # interface type
      model_name: "qwen-vl-plus-latest"            # model name
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API base URL
      api_key: "api_key"                           # API key
      max_token: 500                               # max generated tokens
    # Doubao vision model
    doubao_vision:
      type: "openai"                               # interface type
      model_name: "doubao-1.5-vision-lite-250315"  # model name
      api_key: "api_key"                           # API key
      base_url: "https://ark.cn-beijing.volces.com/api/v3"  # API base URL
      max_tokens: 500                              # max generated tokens

# OTA (over-the-air) config
ota:
  signature_key: ""
  # Test environment, for the local network
  test:
    websocket:
      url: "ws://192.168.208.214:8989/xiaozhi/v1/"  # WebSocket URL
    mqtt:
      enable: false                # when true, the mqtt config is sent to the device
      endpoint: "192.168.208.214"  # MQTT endpoint, may include a port
  # External environment, for production
  external:
    websocket:
      url: "wss://www.tb263.cn:55555/go_ws/xiaozhi/v1/"  # WebSocket URL
    mqtt:
      enable: false                # when true, the mqtt config is sent to the device
      endpoint: "www.youdomain.cn" # MQTT endpoint, may include a port

# MCP (Model Context Protocol)
mcp:
  # Global MCP servers
  global:
    enabled: true  # enable global MCP
    servers:
      # Filesystem MCP server
      - name: "filesystem"
        type: "sse"                           # connection type: SSE
        url: "http://localhost:3001/sse"      # server URL
        enabled: true                         # enabled
      # Memory MCP server
      - name: "memory"
        type: "streamablehttp"                # connection type: streamable HTTP
        url: "http://localhost:3002/mcp"      # server URL
        enabled: true                         # enabled
    reconnect_interval: 300      # reconnect interval (s)
    max_reconnect_attempts: 10   # max reconnect attempts

# Local MCP tools
local_mcp:
  exit_conversation: true           # allow leaving the conversation
  clear_conversation_history: true  # allow clearing the conversation history

# Long memory
memory:
  provider: "nomemo"  # memory provider: nomemo (none), memobase or mem0 (long-term memory)
  nomemo:
    # no extra config
  # Memobase (long-term memory)
  memobase:
    base_url: "https://api.memobase.dev"              # Memobase project URL
    api_key: "your_memobase_api_key_here"             # Memobase API key
    api_version: "v1"                                 # API version
    enable_search: true         # search memory before calling the LLM; adds about 200 ms of delay
    search_threshold: 0.5       # similarity a memory needs to be added to the LLM input
    search_top_k: 3             # how many of the most similar memories are added to the LLM input
  mem0:
    api_key: "your_mem0_api_key_here"
    base_url: "https://api.mem0.ai"
    enable_search: true         # search memory before calling the LLM; adds about 200 ms of delay
    search_threshold: 0.5       # similarity a memory needs to be added to the LLM input
    search_top_k: 3             # how many of the most similar memories are added to the LLM input

# Greeting
enable_greeting: true

# Greetings (picked at random)
greeting_list:
  - "Ciao, sono Xiaozhi, piacere di conoscerti."
  - "Ciao, sono Xiaozhi, di cosa parliamo oggi?"
  - "Ciao, sono Xiaozhi, come posso aiutarti?"

# Wake words, matched against the text the firmware sends in listen/detect.
wakeup_words:
  - "小智"      # Chinese kept: exact bytes the firmware wake word engine sends
  - "小知"      # Chinese kept: exact bytes the firmware wake word engine sends
  - "你好小智"  # Chinese kept: exact bytes the firmware wake word engine sends

voice_identify:
  enable: false
  base_url: "http://192.168.208.214:8080"
  threshold: 0.4  # voiceprint threshold, range 0.0-1.0
